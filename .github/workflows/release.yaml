name: Release

permissions: write-all

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run (no release)"
        required: false
        default: false
        type: boolean

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment:
      name: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git identity
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      # Create tag if triggered by workflow_dispatch
      - name: Create tag
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          VERSION="${{ inputs.version }}"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      # Determine the tag to use
      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      # Install Nix
      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.4

      # Run tests and lint
      - name: Run tests
        run: |
          mise run lint
          go mod download
          mise run test
          goreleaser --version

      # Run GoReleaser
      - name: Run GoReleaser
        if: github.event_name == 'push' || inputs.dry_run != true
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.TAG }}

      # Run GoReleaser in dry-run mode
      - name: Run GoReleaser (Dry Run)
        if: inputs.dry_run == true
        run: goreleaser release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.TAG }}
